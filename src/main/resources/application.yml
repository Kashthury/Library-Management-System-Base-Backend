spring:
  application:
    name: library-management-system

  # Loads ./.env (project root) if present; real OS environment variables still win.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      # Auto-creates / updates the students, books and borrow_records tables on startup.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Business rules (change here, no code changes needed)
library:
  max-books-per-student: 5
  default-loan-days: 14
  block-borrow-with-outstanding-fine: false

# Frontend origins allowed to call the API (Vite default is 5173)
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
